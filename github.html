<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub Profile Viewer</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <h1>GitHub Profile Viewer</h1>

            <p>Search for a GitHub user and view their profile.</p>

            <!-- User enters a GitHub username here -->
            <form id="githubForm">

                <input
                    type="text"
                    id="username"
                    placeholder="Enter GitHub username"
                    required
                >

                <button type="submit">Search</button>

            </form>

            <!-- Loading message -->
            <p id="githubLoading"></p>

            <!-- Error message -->
            <p id="githubError" class="error"></p>

            <!-- JavaScript creates the profile here -->
            <div id="profile"></div>

            <!-- Optional cache button -->
            <button id="clearCacheBtn" class="secondary-btn">
                Clear Cache
            </button>

        </section>

    </main>

    <script src="github.js"></script>

</body>
</html>
