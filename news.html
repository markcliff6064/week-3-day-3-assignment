<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>News Headline Aggregator</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <h1>News Headline Aggregator</h1>

            <p>Browse technology, business, sports and health headlines.</p>

            <!-- Category filter -->
            <div class="filter">

                <label for="category">Choose category:</label>

                <select id="category">
                    <option value="all">All</option>
                    <option value="technology">Technology</option>
                    <option value="business">Business</option>
                    <option value="sports">Sports</option>
                    <option value="health">Health</option>
                </select>

            </div>

            <!-- Loading message -->
            <p id="newsLoading"></p>

            <!-- Error message -->
            <p id="newsError" class="error"></p>

            <!-- JavaScript will place articles here -->
            <div id="newsList"></div>

        </section>

    </main>

    <script src="news.js"></script>

</body>
</html>
